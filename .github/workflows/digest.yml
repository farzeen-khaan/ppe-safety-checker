# F8 — Daily digest: summarise everything in the incident log (Neon main branch) since the
# last successful digest, and post it to Discord #daily-digest.
#
# Repository secrets (Settings → Secrets and variables → Actions → New repository secret):
#   DATABASE_URL                Neon main branch connection string
#   LLM_API_KEY                 for the 3-sentence summary (the standard summary is used if it fails)
#                               (GEMINI_API_KEY is still read for one release if LLM_API_KEY is missing)
#   DISCORD_DIGEST_WEBHOOK_URL  webhook of the #daily-digest channel
#
# The window comes from the log, not the clock: from the end of the last successful digest to
# now. A late run therefore still covers exactly the missing time, and a run that finds nothing
# new (a successful digest ended under an hour ago) is skipped and recorded as skipped.
# A non-zero exit from the digest (no webhook, log unreachable, Discord failure) fails the run.

name: Daily digest

on:
  schedule:
    # 13:17 UTC = 18:17 Pakistan time (no daylight saving). Off the top of the hour, when GitHub's
    # scheduler is busiest; runs still start late, which the window rule above absorbs.
    - cron: "17 13 * * *"
  workflow_dispatch:  # "Run workflow" button in the Actions tab
    inputs:
      hours:
        description: "Optional fixed window in hours (blank = since the last successful digest)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: daily-digest
  cancel-in-progress: false  # two runs never overlap; never cancel a digest halfway, the second waits

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5  # v5+: Node 24 (v4 warned that Node 20 is deprecated)

      - uses: actions/setup-python@v6  # v6+: Node 24
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-digest.txt

      - name: Install the digest's dependencies only (no torch, OpenCV or Ultralytics)
        run: pip install -r requirements-digest.txt

      - name: Send the digest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_API_KEY }}  # old name: remove next release
          DISCORD_DIGEST_WEBHOOK_URL: ${{ secrets.DISCORD_DIGEST_WEBHOOK_URL }}
          HOURS: ${{ inputs.hours }}  # via env, never pasted into the script: no shell injection
        run: |
          if [ -z "$HOURS" ]; then
            python -m src.digest
          elif [[ "$HOURS" =~ ^[0-9]+$ ]]; then
            python -m src.digest --hours "$HOURS"
          else
            echo "hours must be a whole number" >&2
            exit 2
          fi
